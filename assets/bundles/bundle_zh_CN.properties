MI2UI.help  = MI2U Mod\u7684\u4E3B\u7A97\u53E3\u3002\\
    \nAI功能需要开启替换原版输入处理(replaceInput)选项。 \
    \n点击AI按钮弹出配置菜单。\
    \n箭头：移动到屏幕中央。配置：从核心抓取物品。\
    \n独影：挖矿。\
    \n幻型：自动靠近建造规划。配置：自动重建建筑、协助队友建造。\
    \n修理：一旦血量低于60%，自动靠近维修点。\
    \nAT：一款自动瞄准。配置：维修与攻击。\
    \n世处：逻辑自定义AI，玩家即@unit。配置：逻辑代码。\
    \n\n时间缩放：自动将时间流动速度降至帧率/60，避免低帧降低建筑工作效率。
LogicHelper.help  = \u5185\u7F6E\u7F16\u8F91\u5668\u529F\u80FD\u6269\u5C55\u3002\\
    \n[yellow]变量解析：适合处理以属性引用形式命名的变量，例如unit1.coords.x, task.itemtype等等。[]\
    \n有分隔符输入框。当分隔符为空，仅罗列变量名；当分隔符非空，将变量名用分隔符切分显示。\
    \n切分例："unit1.coords.x"  = > "unit1.","coords.","x"\\
    \n可点击复制切片，也可点击左侧粘贴按钮复制完整变量名。\
    \n注意：编辑完成后需退出编辑器界面以更新变量名列表。\
    \n[yellow]查找：查找与替换内容，匹配编辑区的文本框。[]\
    \n可做全词匹配、大小写匹配。\
    \n[yellow]区域复制：剪切或复制一块代码到指定位置。[]\
    \n指定首地址（包含）和末地址（包含）来选择代码块；\
    \n指定插入地址，代码块将会粘贴到该句之前。如果要粘到逻辑末尾，则填尾句地址+1即可。\
    \n若“Jump变换”启用，将按相对位置保留Jump箭头。\
    \n[cyan]窗体属性：层级 = LogicDialog.
CoreInfo.help  = \u4E00\u4E2A\u66F4\u8BE6\u7EC6\u7684\u6838\u5FC3\u4FE1\u606F\u677F\u3002\u53EF\u4EE5\u68C0\u89C6\u6838\u5FC3\u7269\u54C1\u6570\u91CF\uFF08\u53CA\u5176\u53D8\u5316\uFF09\u3001\u5355\u4F4D\u6570\u91CF\u3001\u7535\u7F51\u5206\u6790\u3002\\
    \n有队伍选择按钮，可以更换核心信息板所显示的队伍。\
    \n点击物品图标、悬停于电网条以观察资源变化。\
    \n点击单位图标或电网条以移动镜头到各个单位。

fullAI.help  = \u903B\u8F91\u81EA\u5B9A\u4E49AI\u53EF\u4EE5\u7528\u903B\u8F91\u4EE3\u7801\u63A7\u5236\u73A9\u5BB6\u5355\u4F4D\u884C\u52A8. \u5728\u5B66\u4F1A\u57FA\u672C\u7684\u903B\u8F91\u77E5\u8BC6\u4EE5\u540E, \u4F60\u9700\u8981\u4E86\u89E3\u672CAI\u5BF9\u5E38\u89C4\u903B\u8F91\u505A\u51FA\u7684\u51E0\u4E2A\u6539\u52A8:\\
  \n\n[accent]@unit[]永久自动绑定玩家单位, 不能换绑, 解绑. 所以[accent]Ucontrol, Ulocate[]等可以直接使用。\
  \n\n玩家动作分为两部分: 移动, 攻击, 2个计时器相互独立. 10s不进行控制或者使用[accent]idle, stop[], 就会释放控制权给其他AI.\
  \n\n逻辑基于世界处理器, 可以使用世处的感知世界的指令, 但不能模拟的, 修改世界的指令只能在单人沙盒生效, 例如[accent]SetProp, Write, SetBlock[]等. \
  \n\n部分逻辑功能通过模拟玩家实现, 例如[accent]Control-config[].\
  \n\n可以存储多个自定义逻辑, 但同时只能运行其中一个.\
  \n\n首次使用时, 会加载一个沙盒地形编辑器的默认逻辑.\
  \n\n利用Print语句可以自定义UI. 创建控件的语句如下:\
  \n[accent]UI.row()[]\
  \n给UI窗格换行\
  \n[accent]UI.clear()[]\
  \n清空UI窗格\
  \n[accent]UI.button(变量名)[]\
  \n生成按钮, 设置1,0\
  \n[accent]UI.field(变量名)[]\
  \n生成文本框, 设置数字变量\
  \n[accent]UI.choose(变量名)[]\
  \n生成选择框, 设置物品, 单位, 建筑等类型. 需要初始化变量为一个类型量.\
  \n[accent]UI.info(变量名)[]\
  \n生成信息栏, 监控变量\
  \n在Print语句中编写语句(需要双引号)即可. \
  \n语句每次执行都会生成新控件, 因此请放在初始化语句中.\
  \n\n开发者对不当使用本功能产生的后果无需承担任何责任. Never Mind the Scandal and Liber.

