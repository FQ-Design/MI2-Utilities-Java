ai.preset.centerfollowmode.intro  = \u81EA\u52A8\u79FB\u52A8\u5230\u5C4F\u5E55\u4E2D\u5FC3(\u684C\u9762\u7AEF)\\n\u7559\u5728\u539F\u5730, \u4E0D\u518D\u79FB\u52A8\u5230\u5C4F\u5E55\u4E2D\u5FC3(\u79FB\u52A8\u7AEF)
ai.preset.logicmode  = \u4E16\u5904\u7834\u89E3\u7248
ai.preset.logicmode.intro  = \u7528\u4E16\u754C\u5904\u7406\u5668\u7684\u5F62\u5F0F\u7F16\u5199\u81EA\u5B9A\u4E49\u7684AI.\\
  \n\n\n\n本AI的几个魔改:\
  \n\n[accent]@unit[]永久自动绑定玩家单位, 不能换绑, 解绑. 所以[accent]Ucontrol, Ulocate[]等可以直接使用.\
  \n\n玩家动作分为两部分: 移动, 攻击, 2个计时器相互独立. 10s不进行控制就会释放控制权给其他AI. 使用[accent]Ucontrol-idle[]立即切断移动控制, [accent]Ucontrol-stop[]立即切断攻击控制.\
  \n\n可以使用世处的感知世界的指令, 但不能模拟的或修改世界的指令只在单人沙盒生效, 例如[accent]SetProp, Write, SetBlock[]等. 部分指令模拟玩家实现, 例如[accent]Control-config[].\
  \n\n[accent]Read, Write[]可以读写其他世处AI的变量. 建筑名为目标AI的名称(字符串), 变量名为目标变量的名称(字符串). Read从上往下遍历, Write从下往上遍历, 若有重名AI只读写遍历到的第一个.\
  \n\n利用Print语句生成自定义UI. 创建控件的语句如下:\
  \n[accent]UI.row()[]\
  \n给UI窗格换行\
  \n[accent]UI.clear()[]\
  \n清空UI窗格\
  \n[accent]UI.button(变量名)[]\
  \n生成按钮, 设置1, 0或TRUE, FALSE\
  \n[accent]UI.field(变量名)[]\
  \n生成文本框, 设置数字变量\
  \n[accent]UI.choose(变量名)[]\
  \n生成选择框, 设置物品, 单位, 建筑等类型. 需要初始化变量为一个类型量.\
  \n[accent]UI.info(变量名)[]\
  \n生成信息栏, 监控变量.\
  \n在Print语句中以字符串形式编写语句(需要双引号)即可. 语句每次执行都会生成新控件, 因此请放在初始化语句中.
